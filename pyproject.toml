[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubin-transient-dashboard"
version = "0.1.0"
description = "Notebook inspection of preselected Rubin transient candidates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "astropy>=5", "matplotlib>=3.6", "ipython>=8"]

[project.optional-dependencies]
archives = ["astroquery>=0.4.8", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]
